name: Refresh dental jobs and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dental-jobs-${{ github.ref == 'refs/heads/main' && 'pages' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run refresh
        env:
          JOOBLE_IE_API_KEY: ${{ secrets.JOOBLE_IE_API_KEY }}
      - run: npm run build

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PUBLISH_DENTAL_JOBS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run refresh
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          JOOBLE_IE_API_KEY: ${{ secrets.JOOBLE_IE_API_KEY }}
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
